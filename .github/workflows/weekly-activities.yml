name: Actividades semanales

on:
  schedule:
    # GitHub Actions uses UTC. 12:00 UTC = 06:00 in Mexico City.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jatsi-weekly-activities
  cancel-in-progress: false

jobs:
  activate-and-announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      META_GRAPH_API_VERSION: v25.0
    steps:
      - name: Descargar la página
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar generador visual
        run: npm ci
      - name: Activar las actividades y avisar a la comunidad
        run: node scripts/weekly-activities.mjs
